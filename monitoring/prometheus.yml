global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerting_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # REST API Downloader metrics
  # /metrics requires Bearer auth when DOWNLOADER_KEY is set.
  # Mount the secret token at /etc/prometheus/downloader_bearer_token (never commit secrets).
  - job_name: 'downloader'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/downloader_bearer_token

  # Optional standalone split-worker Prometheus listener (enabled via WORKER_METRICS_PORT=9108)
  - job_name: 'downloader-worker'
    static_configs:
      - targets: ['host.docker.internal:9108']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/downloader_bearer_token

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis metrics (if using Redis)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # System metrics (node_exporter if available)
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']
    scrape_interval: 30s
