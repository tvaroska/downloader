[project]
name = "downloader"
version = "0.6.0"
description = "REST API Downloader - High-performance web service for programmatic URL content downloading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx[http2]>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "python-json-logger>=2.0.0",
    "beautifulsoup4>=4.13.5",
    "markdownify>=0.11.0",
    "lxml>=6.0.1",
    "playwright>=1.40.0",
    "redis>=5.0.0",
    "slowapi>=0.1.9",
    "brotli>=1.2.0",
    "apscheduler>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "E722",  # Bare except
    "B008",  # Function call in argument defaults (FastAPI Depends pattern)
    "B904",  # Exception chaining
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
asyncio_mode = "auto"
timeout = 30
timeout_method = "thread"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--show-capture=no",
    "-ra",
]
markers = [
    "smoke: Fast sanity checks (<3s total) - run on every commit",
    "integration: Tests with Playwright/Redis dependencies (~15s)",
    "e2e: Full system tests with Docker (~60s)",
    "slow: Known slow tests (>5s individual)",
    "network: Tests that require network access to external URLs",
    "requires_redis: Tests requiring Redis instance",
    "requires_playwright: Tests requiring Playwright browser",
    "unit: Pure unit tests with no external dependencies",
]
filterwarnings = [
    "ignore::DeprecationWarning:pythonjsonlogger.*",
]
log_cli = false
log_cli_level = "INFO"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pytest-benchmark>=5.1.0",
    "pre-commit>=4.3.0",
    "pip-audit>=2.7.0",
    "detect-secrets>=1.5.0",
]
