[project]
name = "downloader"
version = "0.7.1"
description = "REST API Downloader - High-performance web service for programmatic URL content downloading"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.24.0",
    "httpx[http2]>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.30",
    "python-json-logger>=2.0.0",
    "beautifulsoup4>=4.13.5",
    "markdownify>=0.11.0",
    "lxml>=6.1.0",
    "playwright>=1.40.0",
    "redis>=5.0.0",
    "slowapi>=0.1.9",
    "brotli>=1.2.1",
    "apscheduler>=3.10.0",
    "pytesseract>=0.3.10",
    "pillow>=13.0.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
]

[tool.uv]
required-version = ">=0.12.24"
constraint-dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "h2>=4.4.1",
    "hpack>=4.2.0",
    "idna>=3.15",
    "msgpack>=1.2.3",
    "pip>=26.1.2",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "setuptools>=78.1.1",
    "soupsieve>=4.0.0",
    "urllib3>=2.8.0",
    "virtualenv>=21.14.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "UP",      # pyupgrade
    "BLE",     # flake8-blind-except
    "C90",     # McCabe cyclomatic complexity
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Function call in argument defaults (FastAPI Depends pattern)
    "B904",  # Exception chaining
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["PLR0913", "PLR0915"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
timeout = 30
timeout_method = "thread"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--show-capture=no",
    "-ra",
]
markers = [
    "smoke: Fast sanity checks (<3s total) - run on every commit",
    "integration: Tests with Playwright/Redis dependencies (~15s)",
    "e2e: Full system tests with Docker (~60s)",
    "slow: Known slow tests (>5s individual)",
    "network: Tests that require network access to external URLs",
    "requires_redis: Tests requiring Redis instance",
    "requires_playwright: Tests requiring Playwright browser",
    "unit: Pure unit tests with no external dependencies",
    "port: Hexagonal port/adapter parity tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:pythonjsonlogger.*",
]
log_cli = false
log_cli_level = "INFO"

[tool.coverage.run]
source = ["src/downloader"]
branch = false

[tool.coverage.report]
fail_under = 83
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    ":\\s*\\.\\.\\.\\s*$",
    "^\\s*\\.\\.\\.\\s*$",
    "class .*\\(Protocol\\):",
]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = ["src", "."]
explicit_package_bases = true
exclude = ["^\\.venv/"]
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "mypy>=1.17.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pre-commit>=4.3.0",
    "detect-secrets>=1.5.0",
]
