[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "downloader-sdk"
version = "0.7.0"
description = "Typed synchronous and asynchronous Python client for the REST API Downloader service."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/downloader_sdk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
