# Default development configuration
# For production, use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# For split API + Worker mode, use: docker compose -f docker-compose.yml -f docker-compose.split.yml up -d

services:
  downloader:
    build: .
    image: downloader:latest
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app/src
      - REDIS_URI=redis://redis:6379
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-all}
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
    command: ["python", "-m", "uvicorn", "src.downloader.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-exclude", ".claude/*", "--timeout-graceful-shutdown", "35"]
    depends_on:
      - redis

  downloader-worker:
    image: downloader:latest
    profiles: ["split"]
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app/src
      - REDIS_URI=redis://redis:6379
      - DEPLOYMENT_MODE=worker
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
    command: ["python", "-m", "src.downloader.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "src.downloader.worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
