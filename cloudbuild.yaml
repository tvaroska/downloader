# Google Cloud Build CI/CD pipeline for Downloader (S3-infra-33)
#
# Replaces `.github/workflows/ci.yml`.
# Runs Ruff lint/format checks, Mypy type checks, and smoke + unit Pytest suites
# before building the production Docker image (`Dockerfile` with Playwright Chromium).
# On `vX.Y.Z` tag pushes (`TAG_NAME` set) or `_PUSH=true`, pushes `:${TAG_NAME}`
# and `:latest` to Artifact Registry (`us-central1-docker.pkg.dev/sites-470716/containers/downloader`).
substitutions:
  _REGION: us-central1
  _AR_REPO: containers
  _IMAGE_NAME: downloader
  _TAG: ""
  _PUSH: "auto"

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: resolve-git-metadata
    name: gcr.io/cloud-builders/git
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        CB_COMMIT="${COMMIT_SHA}"
        CB_TAG_NAME="${TAG_NAME}"
        CB_MANUAL_TAG="${_TAG}"
        CB_TAG="$${CB_TAG_NAME:-$${CB_MANUAL_TAG}}"
        SHA="$${CB_COMMIT:-$$(git rev-parse --short=12 HEAD 2>/dev/null || echo 'local')}"
        printf '%s' "$${SHA}" > /workspace/.resolved_sha
        printf "Resolved commit=%s tag=%s\n" "$${SHA}" "$${CB_TAG}"

  - id: python-lint-typecheck-and-tests
    name: ghcr.io/astral-sh/uv:0.9.1-python3.13-bookworm-slim
    waitFor: ["-"]
    entrypoint: bash
    env:
      - UV_COMPILE_BYTECODE=1
      - UV_LINK_MODE=copy
      - UV_PROJECT_ENVIRONMENT=/workspace/.venv
    args:
      - -c
      - |
        set -euo pipefail
        uv sync --frozen
        /workspace/.venv/bin/ruff check src/ tests/ examples/
        /workspace/.venv/bin/ruff format --check src/ tests/ examples/
        /workspace/.venv/bin/mypy src/
        /workspace/.venv/bin/pytest tests/ -m "not (integration or e2e or network or requires_redis or requires_playwright)" -v --timeout=30

  - id: docker-build-and-push
    name: gcr.io/cloud-builders/docker
    waitFor:
      - resolve-git-metadata
      - python-lint-typecheck-and-tests
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        set -euo pipefail
        SHA="$$(cat /workspace/.resolved_sha)"
        CB_TAG_NAME="${TAG_NAME}"
        CB_MANUAL_TAG="${_TAG}"
        CB_TAG="$${CB_TAG_NAME:-$${CB_MANUAL_TAG}}"
        IMAGE_REPO="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}"
        BUILD_TAG="$${IMAGE_REPO}:$${SHA}"

        docker pull "$${IMAGE_REPO}:latest" || true
        docker build \
          --cache-from "$${IMAGE_REPO}:latest" \
          -t "downloader:ci" \
          -t "$${BUILD_TAG}" \
          -f Dockerfile \
          .

  - id: verify-nonroot-and-healthcheck
    name: gcr.io/cloud-builders/docker
    waitFor:
      - docker-build-and-push
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "Verifying non-root user on downloader:ci..."
        UID_OUT="$$(docker run --rm --entrypoint id downloader:ci -u)"
        test "$${UID_OUT}" != "0"
        echo "Starting downloader-smoke container and probing /health + Playwright Chromium..."
        docker run -d --name downloader-smoke -e ENVIRONMENT=development downloader:ci
        trap "docker rm -f downloader-smoke >/dev/null 2>&1 || true" EXIT
        HEALTH_OK=0
        for i in $$(seq 1 20); do
          if docker exec downloader-smoke curl -fsS http://127.0.0.1:8000/health >/dev/null; then
            echo "HTTP /health probe passed on attempt $$i"
            HEALTH_OK=1
            break
          fi
          sleep 1
        done
        if [[ "$${HEALTH_OK}" -ne 1 ]]; then
          docker logs downloader-smoke || true
          exit 1
        fi
        docker exec downloader-smoke python -c "
        import asyncio
        from playwright.async_api import async_playwright
        async def check():
            async with async_playwright() as p:
                browser = await p.chromium.launch(headless=True)
                page = await browser.new_page()
                await page.set_content('<h1>CI Smoke</h1>')
                pdf = await page.pdf()
                await browser.close()
                assert pdf.startswith(b'%PDF-'), 'Expected valid PDF header'
        asyncio.run(check())
        print('Playwright Chromium headless PDF smoke check passed')
        "

  - id: trivy-vulnerability-scan
    name: gcr.io/cloud-builders/docker
    waitFor:
      - docker-build-and-push
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:0.58.1 image \
          --scanners vuln \
          --pkg-types os \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          downloader:ci

  - id: push-release-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - verify-nonroot-and-healthcheck
      - trivy-vulnerability-scan
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SHA="$$(cat /workspace/.resolved_sha)"
        CB_TAG_NAME="${TAG_NAME}"
        CB_MANUAL_TAG="${_TAG}"
        CB_TAG="$${CB_TAG_NAME:-$${CB_MANUAL_TAG}}"
        IMAGE_REPO="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}"
        BUILD_TAG="$${IMAGE_REPO}:$${SHA}"

        if [[ -n "$${CB_TAG}" || "${_PUSH}" == "true" ]]; then
          if [[ -n "$${CB_TAG}" ]]; then
            docker tag "$${BUILD_TAG}" "$${IMAGE_REPO}:$${CB_TAG}"
            docker push "$${IMAGE_REPO}:$${CB_TAG}"
          fi
          docker push "$${BUILD_TAG}"
          if [[ "$${CB_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker tag "$${BUILD_TAG}" "$${IMAGE_REPO}:latest"
            docker push "$${IMAGE_REPO}:latest"
          fi
        else
          echo "Skipping Artifact Registry push (TAG_NAME and _TAG are empty and _PUSH=${_PUSH})"
        fi

  - id: flux-reconcile
    name: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ops-flux-cli:v2.4.0
    waitFor:
      - push-release-image
    args:
      - "${TAG_NAME}"
      - "${_TAG}"
      - "download"
      - "download"
